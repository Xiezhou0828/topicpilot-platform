title = "TopicPilot secret scanning"

[extend]
useDefault = true

# Keep the default Gitleaks rules. This global allowlist is intentionally
# limited to exact, named revision metadata fields whose value is a Git SHA.
# It does not allow arbitrary API-, token-, key-, or secret-like fields.
[allowlist]
description = "Allow exact commit SHA revision metadata without weakening secret rules"
regexTarget = "match"
regexes = [
  '''^(API_REVISION|WORKER_REVISION|WEB_REVISION|CANONICAL_SHA|CANDIDATE_SHA|RELEASED_SHA|PROMOTED_CANONICAL_SHA)=[0-9a-fA-F]{40}\r?$''',
]
