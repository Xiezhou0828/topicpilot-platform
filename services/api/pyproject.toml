[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "topicpilot-api"
version = "0.1.0"
description = "Read-only enterprise API and PostgreSQL read model for TopicPilot."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
topicpilot-import = "topicpilot_api.cli:main"
topicpilot-formula-research = "topicpilot_api.research_cli:main"
topicpilot-live = "topicpilot_api.live.cli:main"
topicpilot-provider-lineage = "topicpilot_api.provider_lineage_cli:main"
topicpilot-provider-preflight = "topicpilot_api.provider_preflight_cli:main"
topicpilot-reference-check = "topicpilot_api.reference_cli:main"
topicpilot-reference-bundle = "topicpilot_api.reference_bundle_cli:main"
topicpilot-reference-bootstrap = "topicpilot_api.reference_bootstrap_cli:main"
topicpilot-reference-transition = "topicpilot_api.reference_transition_cli:main"
topicpilot-market-identity-remediation = "topicpilot_api.market_identity_remediation_cli:main"
topicpilot-market-calendar-remediation = "topicpilot_api.market_calendar_remediation_cli:main"
topicpilot-market-semantics-check = "topicpilot_api.market_semantics_cli:main"
topicpilot-history-probe = "topicpilot_api.live.history_probe:main"
topicpilot-bootstrap = "topicpilot_api.live.bootstrap:main"
topicpilot-lifecycle = "topicpilot_api.topic_lifecycle_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/topicpilot_api"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "postgres: requires an explicit PostgreSQL test database",
  "research: explicitly non-production research-only tests and fixtures",
  "governance: repository governance-document consistency tests outside the release gate",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
