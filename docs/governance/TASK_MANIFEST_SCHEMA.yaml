{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "TopicPilot governed task manifest",
  "type": "object",
  "required": [
    "task_id",
    "title",
    "status",
    "owner_role",
    "workstream",
    "base_sha",
    "branch",
    "worktree",
    "owned_paths",
    "shared_paths",
    "forbidden_paths",
    "dependencies",
    "implementation_commits",
    "governance_commits",
    "migration_scope",
    "production_scope",
    "owner_decision_required",
    "next_allowed_state"
  ],
  "properties": {
    "task_id": {"type": "string", "pattern": "^[A-Z0-9][A-Z0-9._-]+$"},
    "title": {"type": "string", "minLength": 1},
    "status": {"type": "string"},
    "owner_role": {"type": "string", "minLength": 1},
    "workstream": {"type": "string", "minLength": 1},
    "base_sha": {"type": ["string", "null"]},
    "branch": {"type": ["string", "null"]},
    "worktree": {"type": ["string", "null"]},
    "owned_paths": {"type": "array", "items": {"type": "string"}},
    "shared_paths": {"type": "array", "items": {"type": "string"}},
    "forbidden_paths": {"type": "array", "items": {"type": "string"}},
    "dependencies": {"type": "array", "items": {"type": "string"}},
    "implementation_commits": {"type": "array", "items": {"type": "string"}},
    "governance_commits": {"type": "array", "items": {"type": "string"}},
    "migration_scope": {"type": "string"},
    "production_scope": {"type": "string"},
    "owner_decision_required": {"type": "boolean"},
    "next_allowed_state": {"type": "string"},
    "supersedes": {"type": ["string", "null"]},
    "disposition_evidence": {"type": ["string", "null"]},
    "dependency_notes": {"type": "array", "items": {"type": "string"}},
    "shared_surface_policy": {"type": "string"}
  },
  "additionalProperties": true
}
