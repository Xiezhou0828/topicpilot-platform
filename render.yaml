services:
  - type: web
    name: topicpilot-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c 'alembic upgrade head && topicpilot-import "$TOPICPILOT_BUNDLE_PATH" --schema /fixtures/schema/enterprise_bundle.v1.schema.json && exec uvicorn topicpilot_api.main:app --host 0.0.0.0 --port "$PORT" --proxy-headers'
    healthCheckPath: /healthz
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TOPICPILOT_DEMO_MODE
        value: "true"
      - key: TOPICPILOT_BUNDLE_PATH
        value: /fixtures/demo
      - key: TOPICPILOT_FRESHNESS_DAYS
        value: "3"
      - key: TOPICPILOT_LOG_LEVEL
        value: INFO
      - key: TOPICPILOT_CORS_ORIGINS
        sync: false
      - key: UVICORN_APP
        value: topicpilot_api.main:app
