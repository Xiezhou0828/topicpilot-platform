name: One-time retired Topic cleanup

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact 40-character commit SHA containing migration 0050
        required: true
        type: string
      confirmation:
        description: Type DELETE_EIGHT_RETIRED_TOPICS to authorize execution
        required: true
        type: string

permissions:
  contents: read

jobs:
  purge:
    name: Purge the eight retired Topic rows
    if: ${{ inputs.confirmation == 'DELETE_EIGHT_RETIRED_TOPICS' }}
    runs-on: ubuntu-latest
    environment: production-db-maintenance
    concurrency:
      group: topicpilot-production-db-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Require an exact release SHA
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if ! [[ "$RELEASE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_ref must be an exact 40-character commit SHA." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(echo "$RELEASE_REF" | tr '[:upper:]' '[:lower:]')"

      - name: Build the exact cleanup image
        run: docker build --file infra/docker/api.Dockerfile --tag topicpilot-retired-topic-purge:${{ inputs.release_ref }} .

      - name: Require Production migration head 0049
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.TOPICPILOT_PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$MIGRATION_DATABASE_URL"
          docker run --rm --entrypoint python \
            --env MIGRATION_DATABASE_URL \
            "topicpilot-retired-topic-purge:${{ inputs.release_ref }}" \
            -c 'import os, sys; from sqlalchemy import create_engine, text; e=create_engine(os.environ["MIGRATION_DATABASE_URL"], pool_pre_ping=True); \
            c=e.connect(); rows=[str(r[0]) for r in c.execute(text("SELECT version_num FROM public.alembic_version ORDER BY version_num"))]; c.close(); \
            expected=["0049_task_daily_formal_publication_receipt"]; sys.exit(f"unexpected Production migration head: {rows!r}") if rows != expected else print("Production migration head precondition: 0049")'

      - name: Apply the owner-authorized cleanup transaction
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.TOPICPILOT_PRODUCTION_DATABASE_URL }}
          TOPICPILOT_ALLOW_RETIRED_TOPIC_PURGE: "1"
        run: |
          docker run --rm --entrypoint alembic \
            --env MIGRATION_DATABASE_URL \
            --env TOPICPILOT_ALLOW_RETIRED_TOPIC_PURGE \
            "topicpilot-retired-topic-purge:${{ inputs.release_ref }}" \
            upgrade 0050_task_purge_retired_topics

      - name: Verify the clean 132-topic database state
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.TOPICPILOT_PRODUCTION_DATABASE_URL }}
        run: |
          docker run --rm --entrypoint python \
            --env MIGRATION_DATABASE_URL \
            "topicpilot-retired-topic-purge:${{ inputs.release_ref }}" \
            -c 'import os, sys; from sqlalchemy import create_engine, text; e=create_engine(os.environ["MIGRATION_DATABASE_URL"], pool_pre_ping=True); c=e.connect(); \
            head=str(c.execute(text("SELECT version_num FROM public.alembic_version ORDER BY version_num")).scalar_one()); \
            total=int(c.execute(text("SELECT count(*) FROM topicpilot.topics")).scalar_one()); \
            retired=int(c.execute(text("SELECT count(*) FROM topicpilot.topics WHERE status = $$RETIRED$$")).scalar_one()); \
            target=int(c.execute(text("SELECT count(*) FROM topicpilot.topics WHERE slug IN ($$PCB$$, $$其他建設$$, $$其他晶圓材料$$, $$其他自動化$$, $$其他資安$$, $$其他高速互連$$, $$大型金融權值$$, $$特殊金屬材料$$)")).scalar_one()); \
            dangling=int(c.execute(text("SELECT count(*) FROM topicpilot.instrument_topic_relations r LEFT JOIN topicpilot.topics t ON t.id=r.topic_id WHERE t.id IS NULL")).scalar_one()); c.close(); \
            checks=(head == "0050_task_purge_retired_topics" and total == 132 and retired == 0 and target == 0 and dangling == 0); \
            sys.exit(f"cleanup verification failed: head={head}, total={total}, retired={retired}, target={target}, dangling={dangling}") if not checks else print("Production cleanup verified: head=0050, topics=132, retired=0, target=0, dangling_relations=0")'

      - name: Verify the public 132-topic catalog
        run: |
          payload="$(curl --fail --silent --show-error 'https://topicpilot-api.onrender.com/api/v2/topic-catalog?limit=500&offset=0')"
          python -c 'import json, sys; p=json.loads(sys.argv[1]); total=p.get("total"); items=p.get("items", []); sys.exit(f"public catalog verification failed: total={total}, items={len(items)}") if total != 132 or len(items) != 132 else print("Public catalog verified: 132 topics")' "$payload"
