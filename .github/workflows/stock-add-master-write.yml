name: Production stock-add master writer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run or apply one hash-approved instrument addition
        required: true
        type: choice
        options:
          - dry-run
          - apply
      plan_sha256:
        description: Lowercase SHA-256 of the reviewed plan stored in the protected Environment secret
        required: true
        type: string
      confirmation:
        description: Exact APPLY STOCK ADD confirmation for apply mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: topicpilot-production-db-maintenance
  cancel-in-progress: false

jobs:
  master-write:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production-db-maintenance
    timeout-minutes: 10
    steps:
      - name: Check out exact canonical main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the exact stock-add writer
        run: python -m pip install -e services/api

      - name: Validate and stage hash-bound protected plan
        env:
          PLAN_JSON: ${{ secrets.TOPICPILOT_PRODUCTION_STOCK_ADD_PLAN_JSON }}
          REQUESTED_PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from topicpilot_api.stock_add_master_writer import canonical_sha256

          requested_sha256 = os.environ["REQUESTED_PLAN_SHA256"]
          if not re.fullmatch(r"[0-9a-f]{64}", requested_sha256):
              raise SystemExit("The requested plan SHA-256 must be 64 lowercase hexadecimal characters.")

          raw_plan = os.environ.get("PLAN_JSON", "")
          if not raw_plan:
              raise SystemExit("The protected stock-add plan Environment secret is required.")
          try:
              plan = json.loads(raw_plan)
          except json.JSONDecodeError as exc:
              raise SystemExit("The protected stock-add plan is not valid JSON.") from exc
          if not isinstance(plan, dict):
              raise SystemExit("The protected stock-add plan must be a JSON object.")
          if plan.get("schemaVersion") != "topicpilot-stock-add-master-plan.v1":
              raise SystemExit("The protected stock-add plan schema is not supported.")

          declared_sha256 = plan.get("planSha256")
          computed_sha256 = canonical_sha256(
              {key: value for key, value in plan.items() if key != "planSha256"}
          )
          if declared_sha256 != requested_sha256 or computed_sha256 != requested_sha256:
              raise SystemExit("The protected plan does not match the requested plan SHA-256.")

          path = Path(os.environ["RUNNER_TEMP"]) / "stock-add-master-plan.json"
          path.write_text(raw_plan, encoding="utf-8")
          print(
              "Protected plan validated and staged; "
              f"bytes={path.stat().st_size}; sha256={requested_sha256}"
          )
          PY

      - name: Recheck Production target and show write dry-run
        env:
          GITHUB_SHA: ${{ github.sha }}
          TOPICPILOT_PRODUCTION_STOCK_ADD_DATABASE_URL: ${{ secrets.TOPICPILOT_PRODUCTION_STOCK_ADD_DATABASE_URL }}
          EXPECTED_HOST: ${{ vars.TOPICPILOT_PRODUCTION_STOCK_ADD_EXPECTED_HOST }}
          EXPECTED_DATABASE: ${{ vars.TOPICPILOT_PRODUCTION_STOCK_ADD_EXPECTED_DATABASE }}
          EXPECTED_ROLE: ${{ vars.TOPICPILOT_PRODUCTION_STOCK_ADD_EXPECTED_ROLE }}
          OPERATOR: ${{ github.actor }}
        run: |
          if [ -z "$TOPICPILOT_PRODUCTION_STOCK_ADD_DATABASE_URL" ] || [ -z "$EXPECTED_HOST" ] || [ -z "$EXPECTED_DATABASE" ] || [ -z "$EXPECTED_ROLE" ]; then
            echo "The dedicated stock-add database connection and expected target variables are required." >&2
            exit 1
          fi
          topicpilot-stock-add-apply \
            --plan-file "$RUNNER_TEMP/stock-add-master-plan.json" \
            --environment production \
            --expected-host "$EXPECTED_HOST" \
            --expected-database "$EXPECTED_DATABASE" \
            --expected-role "$EXPECTED_ROLE" \
            --expected-runtime-revision "$GITHUB_SHA" \
            --operator "$OPERATOR" \
            --dry-run \
            > "$RUNNER_TEMP/stock-add-dry-run.json"

      - name: Summarize dry-run without exposing the research package
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "stock-add-dry-run.json").read_text())
          print("## Stock-add Production dry-run")
          for key, label in (
              ("status", "Result"),
              ("action", "Selected path"),
              ("market", "Market"),
              ("stockCode", "Stock"),
              ("publicationVersion", "Research publication version"),
              ("planSha256", "Plan SHA-256"),
              ("requiredConfirmation", "Exact confirmation"),
          ):
              print(f"- {label}: `{result.get(key)}`")
          authorization = result.get("publicationAuthorization") or {}
          mode = authorization.get("authorizationMode")
          if mode == "OWNER_STANDING_POLICY":
              print(
                  "- Research content authorization: `"
                  f"{authorization.get('policyId')} · score "
                  f"{authorization.get('dataCompletenessScore')} > "
                  f"{authorization.get('threshold')} · owner review remains pending`"
              )
          elif mode:
              print(f"- Research content authorization: `{mode}`")
          if os.environ["MODE"] == "dry-run":
              print("- Production writes: `NONE` (dry-run only)")
          else:
              print("- The following protected step will recheck this plan before applying it.")
          PY

      - name: Apply only the exact confirmed master addition
        if: ${{ inputs.mode == 'apply' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          TOPICPILOT_PRODUCTION_STOCK_ADD_DATABASE_URL: ${{ secrets.TOPICPILOT_PRODUCTION_STOCK_ADD_DATABASE_URL }}
          TOPICPILOT_ALLOW_STOCK_ADD_APPLY: "1"
          EXPECTED_HOST: ${{ vars.TOPICPILOT_PRODUCTION_STOCK_ADD_EXPECTED_HOST }}
          EXPECTED_DATABASE: ${{ vars.TOPICPILOT_PRODUCTION_STOCK_ADD_EXPECTED_DATABASE }}
          EXPECTED_ROLE: ${{ vars.TOPICPILOT_PRODUCTION_STOCK_ADD_EXPECTED_ROLE }}
          OPERATOR: ${{ github.actor }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          topicpilot-stock-add-apply \
            --plan-file "$RUNNER_TEMP/stock-add-master-plan.json" \
            --environment production \
            --expected-host "$EXPECTED_HOST" \
            --expected-database "$EXPECTED_DATABASE" \
            --expected-role "$EXPECTED_ROLE" \
            --expected-runtime-revision "$GITHUB_SHA" \
            --operator "$OPERATOR" \
            --apply \
            --confirm "$CONFIRMATION" \
            | tee "$RUNNER_TEMP/stock-add-applied.json"

      - name: Summarize verified Production write
        if: ${{ inputs.mode == 'apply' }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "stock-add-applied.json").read_text())
          print("## Stock-add Production write result")
          for key, label in (
              ("status", "Result"),
              ("action", "Path"),
              ("market", "Market"),
              ("stockCode", "Stock"),
              ("instrumentId", "Master ID"),
              ("publicationVersion", "Research publication version"),
              ("planSha256", "Plan SHA-256"),
          ):
              print(f"- {label}: `{result.get(key)}`")
          authorization = result.get("publicationAuthorization") or {}
          mode = authorization.get("authorizationMode")
          if mode == "OWNER_STANDING_POLICY":
              print(
                  "- Research content authorization: `"
                  f"{authorization.get('policyId')} · score "
                  f"{authorization.get('dataCompletenessScore')} > "
                  f"{authorization.get('threshold')} · owner review remains pending`"
              )
          elif mode:
              print(f"- Research content authorization: `{mode}`")
          PY
