name: Governance

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Validate task runtime and ownership contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate governance manifests and registries
        run: python scripts/governance/validate_governance.py --self-test
      - name: Run governance unit tests
        run: python -m unittest discover -s scripts/governance/tests -p "test_*.py"
      - name: Scan incomplete-work candidates without mutation
        run: python scripts/governance/audit_incomplete_work.py --path . --summary
      - name: Check whitespace
        run: git diff --check
