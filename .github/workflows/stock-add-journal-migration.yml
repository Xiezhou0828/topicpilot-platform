name: Production stock-add schema migration

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: Type APPLY STOCK ADD SCHEMA 0052
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: topicpilot-production-db-maintenance
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical main and exact migration confirmation
        env:
          CONFIRM_MIGRATION: ${{ inputs.confirm_migration }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM_MIGRATION" = "APPLY STOCK ADD SCHEMA 0052"

  migrate:
    needs: validate
    if: ${{ needs.validate.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production-db-maintenance
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: python -m pip install -e services/api

      - name: Require exact Production migration head 0050
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.TOPICPILOT_PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "TOPICPILOT_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi
          PYTHONPATH=services/api/src python - <<'PY'
          import os, sys
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["MIGRATION_DATABASE_URL"], pool_pre_ping=True)
          with engine.connect() as connection:
              heads = list(connection.execute(text("SELECT version_num FROM public.alembic_version")).scalars())
          engine.dispose()
          expected = ["0050_task_purge_retired_topics"]
          if heads != expected:
              sys.exit(f"unexpected Production migration head: {heads!r}")
          print("Production migration head precondition: 0050")
          PY

      - name: Apply stock-add journal and research publication schema
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.TOPICPILOT_PRODUCTION_DATABASE_URL }}
        run: alembic -c services/api/alembic.ini upgrade 0052_company_research_publications

      - name: Verify migration head, tables, and append-only triggers
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.TOPICPILOT_PRODUCTION_DATABASE_URL }}
        run: |
          PYTHONPATH=services/api/src python - <<'PY'
          import os, sys
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["MIGRATION_DATABASE_URL"], pool_pre_ping=True)
          with engine.connect() as connection:
              head = connection.execute(text("SELECT version_num FROM public.alembic_version")).scalar_one()
              tables = connection.execute(text(
                  "SELECT to_regclass('topicpilot.stock_add_operations') IS NOT NULL "
                  "AND to_regclass('topicpilot.stock_add_operation_events') IS NOT NULL "
                  "AND to_regclass('topicpilot.company_research_publications') IS NOT NULL"
              )).scalar_one()
              triggers = connection.execute(text(
                  "SELECT count(*) FROM pg_trigger WHERE tgname IN ("
                  "'trg_stock_add_operations_append_only', "
                  "'trg_stock_add_operation_events_append_only', "
                  "'trg_company_research_publications_append_only') AND NOT tgisinternal"
              )).scalar_one()
          engine.dispose()
          if head != "0052_company_research_publications" or not tables or triggers != 3:
              sys.exit(f"migration verification failed: head={head}, tables={tables}, triggers={triggers}")
          print("Production stock-add schema verified: head=0052; tables=3; append-only triggers=3")
          PY
