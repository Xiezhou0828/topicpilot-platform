name: Production forensic readback

on:
  workflow_dispatch:
    inputs:
      forensic_command:
        description: Fixed forensic command
        required: true
        type: choice
        options:
          - POST_CLOSE_RUN_READBACK
      run_id:
        description: One POST_CLOSE run UUID to read
        required: true
        type: string
      forensic_ref:
        description: Exact 40-character canonical commit SHA
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: topicpilot-production-forensic-readback
  cancel-in-progress: false

jobs:
  readback:
    name: Production SELECT-only forensic readback
    runs-on: ubuntu-latest
    environment: production-readonly
    steps:
      - name: Require protected production-readonly Environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/production-readonly")"
          ENVIRONMENT_JSON="$environment_json" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["ENVIRONMENT_JSON"])
          rules = payload.get("protection_rules", [])
          if not any(rule.get("type") == "required_reviewers" for rule in rules):
              raise SystemExit(
                  "production-readonly must have at least one required reviewer protection rule"
              )
          print("production-readonly Environment protection: required reviewer present")
          PY

      - name: Validate dispatch inputs before checkout
        env:
          FORENSIC_COMMAND: ${{ inputs.forensic_command }}
          RUN_ID: ${{ inputs.run_id }}
          FORENSIC_REF: ${{ inputs.forensic_ref }}
        run: |
          set -euo pipefail
          if [[ "$FORENSIC_COMMAND" != "POST_CLOSE_RUN_READBACK" ]]; then
            echo "Only POST_CLOSE_RUN_READBACK is allowed." >&2
            exit 1
          fi
          if [[ ! "$FORENSIC_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "forensic_ref must be an exact 40-character commit SHA." >&2
            exit 1
          fi
          python - "$RUN_ID" <<'PY'
          import re
          import sys

          value = sys.argv[1]
          pattern = re.compile(
              r"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-"
              r"[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
          )
          if not pattern.fullmatch(value):
              raise SystemExit("run_id must be one canonical UUID")
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.forensic_ref }}
          fetch-depth: 0

      - name: Require exact canonical revision
        env:
          FORENSIC_REF: ${{ inputs.forensic_ref }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="$(printf '%s' "$FORENSIC_REF" | tr '[:upper:]' '[:lower:]')"
          test "$actual_sha" = "$expected_sha"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$actual_sha" origin/main
          echo "FORENSIC_TOOL_SHA=$actual_sha"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install the repository-owned forensic CLI
        run: python -m pip install services/api

      - name: Execute fixed SELECT-only readback
        env:
          FORENSIC_COMMAND: ${{ inputs.forensic_command }}
          RUN_ID: ${{ inputs.run_id }}
          TOPICPILOT_FORENSIC_TOOL_SHA: ${{ inputs.forensic_ref }}
          TOPICPILOT_PRODUCTION_READONLY_DATABASE_URL: ${{ secrets.TOPICPILOT_PRODUCTION_READONLY_DATABASE_URL }}
          TOPICPILOT_PRODUCTION_READONLY_ROLE: ${{ vars.TOPICPILOT_PRODUCTION_READONLY_ROLE }}
          OUTPUT_PATH: ${{ runner.temp }}/production-forensic-readback.json
        run: |
          set -euo pipefail
          python -m topicpilot_api.production_forensic_readback \
            --command "$FORENSIC_COMMAND" \
            --run-id "$RUN_ID" \
            --output "$OUTPUT_PATH"
          test -s "$OUTPUT_PATH"
          python - "$OUTPUT_PATH" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              artifact = json.load(handle)
          required = {
              "forensicToolSha",
              "databaseRole",
              "transactionReadOnly",
              "run",
              "attemptSummary",
              "checkpointTimeline",
              "marketSummary",
              "errorSummary",
              "providerStatusSummary",
              "generatedAt",
          }
          missing = sorted(required - artifact.keys())
          if missing or artifact["transactionReadOnly"] is not True:
              raise SystemExit(f"invalid sanitized forensic artifact: {missing}")
          PY

      - name: Write compact job summary
        env:
          RUN_ID: ${{ inputs.run_id }}
          FORENSIC_REF: ${{ inputs.forensic_ref }}
        run: |
          {
            echo "## Production forensic readback"
            echo "- Command: POST_CLOSE_RUN_READBACK"
            echo "- Run ID: $RUN_ID"
            echo "- Tool SHA: $FORENSIC_REF"
            echo "- Database mode: transaction-level READ ONLY"
            echo "- Scope: live_collector_runs, live_collector_attempts, live_collector_checkpoints"
            echo "- Raw SQL input: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized forensic artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-forensic-readback-${{ inputs.run_id }}
          path: ${{ runner.temp }}/production-forensic-readback.json
          if-no-files-found: error
          retention-days: 14
