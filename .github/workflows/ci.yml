name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, migration, and OpenAPI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: topicpilot_test
          POSTGRES_USER: topicpilot
          POSTGRES_PASSWORD: topicpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topicpilot -d topicpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://topicpilot:topicpilot_test@localhost:5432/topicpilot_test
      TOPICPILOT_CORS_ORIGINS: http://localhost:3000
      TOPICPILOT_LOG_LEVEL: INFO
      OPENAPI_APP: topicpilot_api.main:app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API and development dependencies
        run: python -m pip install -e "services/api[dev]"
      - name: Ruff
        run: python -m ruff check services/api infra/scripts
      - name: Migrate an empty PostgreSQL database
        working-directory: services/api
        run: python -m alembic upgrade head
      - name: Migration rollback smoke test
        working-directory: services/api
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - name: Backend tests
        run: python -m pytest services/api/tests
      - name: OpenAPI contract and drift check
        env:
          PYTHONPATH: services/api/src
        run: >-
          python infra/scripts/check_openapi_drift.py
          --app "$OPENAPI_APP"
          --baseline packages/api-client/openapi.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json
      - name: Verify generated TypeScript API contract
        run: |
          npm ci --prefix packages/api-client
          npm run generate --prefix packages/api-client
          npm test --prefix packages/api-client
          git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/schema.d.ts apps/web/app/lib/generated-api.d.ts

  frontend:
    name: Frontend install, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix apps/web
      - name: Lint
        run: npm run lint --prefix apps/web
      - name: Verify synthetic snapshot fixture
        run: npm run demo:snapshot:check --prefix apps/web
      - name: Test
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm test --prefix apps/web
      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build --prefix apps/web

  compose:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build, migrate, seed, and probe the API
        run: bash infra/scripts/compose-smoke.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
