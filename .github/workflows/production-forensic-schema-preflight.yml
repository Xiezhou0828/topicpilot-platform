name: Production forensic schema preflight

on:
  workflow_dispatch:
    inputs:
      preflight_command:
        description: Fixed metadata-only preflight command
        required: true
        type: choice
        options:
          - PRODUCTION_READONLY_SCHEMA_PREFLIGHT
      preflight_ref:
        description: Exact 40-character canonical commit SHA
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: topicpilot-production-forensic-schema-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Production SELECT-only schema preflight
    runs-on: ubuntu-latest
    environment: production-readonly
    steps:
      - name: Require protected production-readonly Environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/production-readonly")"
          ENVIRONMENT_JSON="$environment_json" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["ENVIRONMENT_JSON"])
          rules = payload.get("protection_rules", [])
          if not any(rule.get("type") == "required_reviewers" for rule in rules):
              raise SystemExit(
                  "production-readonly must have at least one required reviewer protection rule"
              )
          print("production-readonly Environment protection: required reviewer present")
          PY

      - name: Validate dispatch input before checkout
        env:
          PREFLIGHT_COMMAND: ${{ inputs.preflight_command }}
          PREFLIGHT_REF: ${{ inputs.preflight_ref }}
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_COMMAND" != "PRODUCTION_READONLY_SCHEMA_PREFLIGHT" ]]; then
            echo "Only PRODUCTION_READONLY_SCHEMA_PREFLIGHT is allowed." >&2
            exit 1
          fi
          if [[ ! "$PREFLIGHT_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "preflight_ref must be an exact 40-character commit SHA." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.preflight_ref }}
          fetch-depth: 0

      - name: Require exact canonical revision
        env:
          PREFLIGHT_REF: ${{ inputs.preflight_ref }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="$(printf '%s' "$PREFLIGHT_REF" | tr '[:upper:]' '[:lower:]')"
          test "$actual_sha" = "$expected_sha"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$actual_sha" origin/main
          echo "FORENSIC_TOOL_SHA=$actual_sha"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install the repository-owned forensic CLI
        run: python -m pip install services/api

      - name: Execute fixed metadata-only preflight
        env:
          PREFLIGHT_COMMAND: ${{ inputs.preflight_command }}
          TOPICPILOT_FORENSIC_TOOL_SHA: ${{ inputs.preflight_ref }}
          TOPICPILOT_PRODUCTION_READONLY_DATABASE_URL: ${{ secrets.TOPICPILOT_PRODUCTION_READONLY_DATABASE_URL }}
          TOPICPILOT_PRODUCTION_READONLY_ROLE: ${{ vars.TOPICPILOT_PRODUCTION_READONLY_ROLE }}
          OUTPUT_PATH: ${{ runner.temp }}/production-forensic-schema-preflight.json
        run: |
          set -euo pipefail
          python -m topicpilot_api.production_forensic_readback \
            --command "$PREFLIGHT_COMMAND" \
            --output "$OUTPUT_PATH"
          test -s "$OUTPUT_PATH"
          python - "$OUTPUT_PATH" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              artifact = json.load(handle)
          required = {
              "forensicToolSha",
              "databaseName",
              "databaseRole",
              "sessionUser",
              "transactionReadOnly",
              "tableExistence",
              "columnInventory",
              "missingColumns",
              "unexpectedRelevantColumns",
              "targetPrivileges",
              "mutationPrivilegesPresent",
              "primaryFailureLayer",
              "generatedAt",
          }
          missing = sorted(required - artifact.keys())
          if missing or artifact["transactionReadOnly"] not in {"on", "true", "1"}:
              raise SystemExit(f"invalid sanitized preflight artifact: {missing}")
          if artifact["mutationPrivilegesPresent"] != "NO":
              raise SystemExit("preflight reported mutation privileges")
          PY

      - name: Write compact job summary
        env:
          PREFLIGHT_REF: ${{ inputs.preflight_ref }}
        run: |
          {
            echo "## Production forensic schema preflight"
            echo "- Command: PRODUCTION_READONLY_SCHEMA_PREFLIGHT"
            echo "- Tool SHA: $PREFLIGHT_REF"
            echo "- Database mode: transaction-level READ ONLY"
            echo "- Scope: identity, information_schema, and target-table privilege metadata"
            echo "- Incident rows: not queried"
            echo "- Raw SQL input: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized schema preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-forensic-schema-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/production-forensic-schema-preflight.json
          if-no-files-found: error
          retention-days: 14
